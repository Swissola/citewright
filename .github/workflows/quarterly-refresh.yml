name: Quarterly refresh reminder

on:
  schedule:
    - cron: "0 7 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the issue instead of creating it"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Open the quarterly refresh issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          quarter=$(( ( $(date -u +%-m) - 1 ) / 3 + 1 ))
          title="Quarterly evidence refresh: $(date -u +%Y) Q${quarter}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run. Would create: $title"
            cat .github/refresh-checklist.md
            exit 0
          fi
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number -q 'length')
          if [ "$existing" != "0" ]; then
            echo "An open issue titled \"$title\" already exists. Nothing to do."
            exit 0
          fi
          gh issue create --title "$title" --body-file .github/refresh-checklist.md --assignee "$OWNER"
